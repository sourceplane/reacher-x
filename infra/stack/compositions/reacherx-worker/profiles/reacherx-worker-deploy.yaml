apiVersion: sourceplane.io/v1alpha1
kind: ExecutionProfile
metadata:
  name: reacherx-worker-deploy
spec:
  description: Full pipeline including build, deploy, and smoke test

  policies:
    requireApproval: true
    requireCleanGitTree: true

  # The deploy step talks to the Cloudflare API (wrangler deploy): declare the
  # credential as an orun secret binding so the runner resolves + injects it at
  # run time. Verify/pull-request profiles carry no bindings.
  secretBindings:
    CLOUDFLARE_API_TOKEN: { required: true }
    # The account id is a non-secret connection fact, brokered from the same
    # Cloudflare integration (template: account-id), bound here so the deploy
    # step needs no ambient CI value for it either.
    CLOUDFLARE_ACCOUNT_ID: { required: true }

  # After the deploy step succeeds, Orun writes these secrets into the
  # deployed Worker (the component's per-environment `scriptName`). The values
  # come from the component's secretEnv and never pass through a file or log.
  materialize:
    target: cloudflare-worker
    secrets:
      - WORKOS_COOKIE_PASSWORD

  jobs:
    verify-deploy:
      includeCapabilities:
        - reacherx-worker.setup-node
        - reacherx-worker.setup-pnpm
        - reacherx-worker.install
        - reacherx-worker.verify-structure
        - reacherx-worker.build
        - reacherx-worker.verify-output
        - reacherx-worker.deploy
        - reacherx-worker.smoke
