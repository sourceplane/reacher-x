apiVersion: sourceplane.io/v1alpha1
kind: ComponentSchema
metadata:
  name: convex-deploy-component
spec:
  type: convex-deploy
  schema:
    $schema: http://json-schema.org/draft-07/schema#
    title: Convex Deploy Component
    type: object
    required:
      - name
      - type
      - parameters
    properties:
      name:
        type: string
      type:
        type: string
        const: convex-deploy
      parameters:
        type: object
        required:
          - nodeVersion
          - pnpmVersion
        properties:
          nodeVersion:
            type: string
          pnpmVersion:
            type: string
          installCommand:
            type: string
            default: pnpm install --frozen-lockfile
          functionsDir:
            type: string
            default: convex
        additionalProperties: true
    additionalProperties: true
